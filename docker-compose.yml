version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: umarmahmoodshk
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gotham_time_manager_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    image: elixir:1.16-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-c", "apk add --no-cache git && mix deps.get && mix ecto.create && mix ecto.migrate && mix phx.server"]
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  db_data:
