language: elixir

elixir: '1.15'
otp_release: '25.0'

services:
  - docker
  - postgresql

cache:
  directories:
    - deps
    - _build
    - ~/.hex
    - ~/.mix

before_script:
  # create test db user and db (if needed)
  - psql -c 'CREATE DATABASE gotham_time_manager_test;' -U postgres
  - psql -c "ALTER USER postgres PASSWORD 'postgres';" -U postgres

jobs:
  include:
    - stage: "Test Elixir"
      install:
        - mix local.hex --force
        - mix local.rebar --force
        - mix deps.get

    - stage: "Build Docker"
      script:
        - docker build -t umarshk7/gotham_time_manager:latest .
        - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        - docker push umarshk7/gotham_time_manager:latest
